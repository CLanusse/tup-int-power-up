name: CI

on:
  push:
  pull_request:

env:
  NODE_VERSION: 22

# Entrega 1 (prototipo): solo frontend. La API se simula con MSW, así que no
# hace falta backend ni base de datos en ningún job.
jobs:
  frontend:
    name: Frontend (lint, tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run build
